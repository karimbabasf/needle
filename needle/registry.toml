batch = 16
cap = 64
enough = 4
fix = 64
trust = 0.5
normal = { clusters = 2 }

[code.medium]
strategy = "cluster"
batch = 32
cap = 256
enough = 4
fix = 128
trust = 0.5
normal = { clusters = 3 }

[code.hard]
strategy = "cluster"
batch = 64
cap = 512
enough = 3
fix = 256
trust = 0.5
normal = { clusters = 4 }

[code.extreme]
strategy = "cluster"
batch = 64
cap = 1024
enough = 2
fix = 0
trust = 0.5
normal = { clusters = 4 }

