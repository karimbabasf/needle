[project]
name = "needle"
version = "0.1.0"
description = "Route every prompt to the sampling strategy that fits it, check the result, fix what looks off."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
authors = [{ name = "Karim Baba" }]
dependencies = []

[project.optional-dependencies]
bench = ["numpy>=1.26", "matplotlib>=3.8", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["needle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
