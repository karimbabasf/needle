# The registry: every strategy needle can run, filed by kind of problem and how hard it is.
# The router looks up one row and runs it. Edit a row or add one; nothing else changes.
#
# probe:  samples drawn first to measure how hard the problem is
# levels: probe score cut-offs for easy, medium, hard (below the last one is extreme)
# strategy: vote (most common answer), cluster (pass the tests, then group programs by behaviour),
#           first-pass (stop at the first sample the checker accepts), medoid (the most typical text)
# batch:  samples per round      cap: most samples the strategy may spend
# stop:   vote stops once the leader is this likely to stay the leader
# enough: cluster stops once the biggest group of passing programs has this many members
# fix:    extra samples the fixer may spend when the checker flags the result
# trust:  the checker flags any answer it rates below this
# normal: what a healthy result looks like for this row; the checker flags anything worse

[answer]
probe = 4
levels = [0.75, 0.5, 0.25]

[answer.easy]
strategy = "vote"
batch = 4
cap = 8
stop = 0.95
fix = 0
trust = 0.6
normal = { share = 0.6 }

[answer.medium]
strategy = "vote"
batch = 8
cap = 16
stop = 0.95
fix = 0
trust = 0.5
normal = { share = 0.4 }

[answer.hard]
strategy = "vote"
batch = 16
cap = 128
stop = 0.95
fix = 0
trust = 0.4
normal = { share = 0.2 }

[answer.extreme]
strategy = "vote"
batch = 16
cap = 128
stop = 0.95
fix = 0
trust = 0.3
normal = { share = 0.1 }

[code]
probe = 16
levels = [0.5, 0.125, 0.0625]

[code.easy]
